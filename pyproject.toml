[project]
name = "chunky"
version = "0.1.0"
description = "Streaming language model with learned KV-cache compression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "wandb>=0.16.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunky"]

[tool.ruff]
line-length = 110
target-version = "py310"
